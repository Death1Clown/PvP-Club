<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Status</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; text-align: center; border: 1px solid #333; }
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 1rem; transition: 0.3s; }
        .online { background: #2e7d32; color: #a5d6a7; }
        .offline { background: #c62828; color: #ef9a9a; }
        h2 { margin: 0.5rem 0; color: #fff; }
        #motd { color: #bbb; font-size: 0.9rem; min-height: 40px; }
        .stats { margin: 20px 0; padding: 15px; background: #252525; border-radius: 10px; }
        .player-bar { background: #444; height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .player-fill { background: #4caf50; height: 100%; width: 0%; transition: width 1s ease-in-out; }
        .ip-box { cursor: pointer; background: #333; padding: 10px; border-radius: 5px; font-family: monospace; margin-top: 15px; border: 1px dashed #555; transition: 0.3s; color: #4caf50; font-weight: bold; }
        .ip-box:hover { background: #444; border-color: #4caf50; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="card" id="server-card">
    <div id="status-badge" class="status-badge">Checking...</div>
    <h2 id="server-name">Loading...</h2>
    <p id="motd">Connecting to API...</p>

    <div class="stats">
        <div>Players: <span id="player-count">0 / 0</span></div>
        <div class="player-bar"><div id="player-fill" class="player-fill"></div></div>
        <div style="margin-top: 10px; font-size: 0.8rem;">Version: <span id="version">N/A</span></div>
    </div>

    <div id="display-ip" class="ip-box" onclick="copyIP()">Loading IP...</div>
    <small style="color: #666; margin-top: 10px; display: block;">Click IP to copy</small>
</div>

<script>
    const serverIP = "pvpclubnet.falix.pro:45608"; 

    document.getElementById('display-ip').innerText = serverIP;

    async function updateStatus() {
        try {
            const response = await fetch(`https://mcapi.us/server/status?ip=${serverIP}`);
            const data = await response.json();

            const badge = document.getElementById('status-badge');
            const fill = document.getElementById('player-fill');
            const motdElement = document.getElementById('motd');

            if (data.online) {
                badge.innerText = "Online";
                badge.className = "status-badge online";
                document.getElementById('server-name').innerText = "Server Live";

                let cleanMotd = data.motd.replace(/§[0-9a-fk-or]/gi, '');
                motdElement.innerText = cleanMotd || "Welcome to the server!";
                
                document.getElementById('player-count').innerText = `${data.players.now} / ${data.players.max}`;
                document.getElementById('version').innerText = data.server.name || "Unknown";
                
                const percent = (data.players.now / data.players.max) * 100;
                fill.style.width = (percent || 0) + "%";
            } else {
                badge.innerText = "Offline";
                badge.className = "status-badge offline";
                document.getElementById('server-name').innerText = "Server Offline";
                motdElement.innerText = "Server is currently unreachable.";
                fill.style.width = "0%";
            }
        } catch (error) {
            console.error("Error fetching API:", error);
            document.getElementById('status-badge').innerText = "Error";
        }
    }

    function copyIP() {
        navigator.clipboard.writeText(pvpclubnet.falix.pro);
        const box = document.getElementById('display-ip');
        const originalText = box.innerText;
        box.innerText = "COPIED!";
        setTimeout(() => { box.innerText = originalText; }, 1500);
    }

    updateStatus();
    setInterval(updateStatus, 30000); 
</script>

</body>
</html>
